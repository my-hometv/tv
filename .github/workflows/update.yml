name: Update and Check Playlist

on:
  workflow_dispatch:

  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------
      # 1. Checkout repository
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Setup Python
      # ---------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ---------------------------------------
      # 3. Install Python packages
      # ---------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      # ---------------------------------------
      # 4. Clean / normalize Playlist.m3u
      # ---------------------------------------
      - name: Clean playlist
        run: |
          python update_playlist.py

      # ---------------------------------------
      # 5. Check all current streams
      #
      # IMPORTANT:
      # Run only ONCE so one GitHub Action run
      # equals one failure count.
      # ---------------------------------------
      - name: Check playlist
        run: |
          python check_playlist.py

      # ---------------------------------------
      # 6. Try to refresh broken stream URLs
      # ---------------------------------------
      - name: Refresh broken stream URLs
        run: |
          python update_sources.py

      # ---------------------------------------
      # 7. Move consistently broken channels
      # to 99.Offline.
      #
      # Working channels previously in
      # 99.Offline are restored automatically.
      # ---------------------------------------
      - name: Reorganize offline channels
        run: |
          python reorganize_playlist.py

      # ---------------------------------------
      # 8. Upload reports as GitHub artifact
      # ---------------------------------------
      - name: Upload playlist reports
        uses: actions/upload-artifact@v4
        with:
          name: playlist-report
          path: |
            playlist_report.txt
            source_update_report.txt
          if-no-files-found: warn

      # ---------------------------------------
      # 9. Commit changed files
      # ---------------------------------------
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Playlist.m3u
          git add playlist_status.json
          git add playlist_report.txt

          if [ -f source_update_report.txt ]; then
            git add source_update_report.txt
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update playlist streams and offline groups"
            git pull --rebase
            git push
          fi
