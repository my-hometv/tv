name: Update IPTV Playlists

on:
  workflow_dispatch:

  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =====================================
      # 1. Checkout repository
      # =====================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =====================================
      # 2. Set up Python
      # =====================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # =====================================
      # 3. Install dependencies
      # =====================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      # =====================================
      # 4. Check/remove safe duplicates
      #
      # Same name + same URL:
      # delete duplicate
      #
      # Same name + different URL:
      # keep and report only
      # =====================================
      - name: Check and remove duplicate channels
        run: |
          python deduplicate_master.py

      # =====================================
      # 5. Refresh configured broken URLs
      #
      # update_sources.py must use:
      #
      # PLAYLIST_FILE = Path("Master.m3u")
      # =====================================
      - name: Refresh eligible stream URLs
        run: |
          python update_sources.py

      # =====================================
      # 6. Deep stream check
      #
      # check_playlist.py checks:
      #
      # manifest
      # variant playlist
      # one media segment
      # =====================================
      - name: Check master playlist
        run: |
          python check_playlist.py

      # =====================================
      # 7. Generate active/offline playlists
      #
      # Playlist.m3u:
      # visible channels
      #
      # Offline.m3u:
      # CONSISTENTLY_BROKEN only
      # =====================================
      - name: Generate active and offline playlists
        run: |
          python reorganize_playlist.py

      # =====================================
      # 8. Sort generated playlists
      #
      # group
      # then channel name
      # =====================================
      - name: Sort generated playlists
        run: |
          python sort_playlist.py

      # =====================================
      # 9. Build category/language playlists
      #
      # Malayalam.m3u
      # Hindi.m3u
      # English.m3u
      # Tamil.m3u
      # Kids.m3u
      # Food.m3u
      # Sports.m3u
      # =====================================
      - name: Build category playlists
        run: |
          python build_category_playlists.py

      # =====================================
      # 10. Upload reports
      # =====================================
      - name: Upload playlist reports
        uses: actions/upload-artifact@v7
        with:
          name: playlist-report
          path: |
            playlist_report.txt
            source_update_report.txt
            duplicate_report.txt
          if-no-files-found: warn

      # =====================================
      # 11. Commit updated/generated files
      # =====================================
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f Master.m3u ]; then
            git add Master.m3u
          fi

          if [ -f Playlist.m3u ]; then
            git add Playlist.m3u
          fi

          if [ -f Offline.m3u ]; then
            git add Offline.m3u
          fi

          if [ -f Malayalam.m3u ]; then
            git add Malayalam.m3u
          fi

          if [ -f Hindi.m3u ]; then
            git add Hindi.m3u
          fi

          if [ -f English.m3u ]; then
            git add English.m3u
          fi

          if [ -f Tamil.m3u ]; then
            git add Tamil.m3u
          fi

          if [ -f Kids.m3u ]; then
            git add Kids.m3u
          fi

          if [ -f Food.m3u ]; then
            git add Food.m3u
          fi

          if [ -f Sports.m3u ]; then
            git add Sports.m3u
          fi

          if [ -f playlist_status.json ]; then
            git add playlist_status.json
          fi

          if [ -f playlist_report.txt ]; then
            git add playlist_report.txt
          fi

          if [ -f source_update_report.txt ]; then
            git add source_update_report.txt
          fi

          if [ -f duplicate_report.txt ]; then
            git add duplicate_report.txt
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTV playlists"
            git pull --rebase
            git push
          fi
