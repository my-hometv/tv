name: Update IPTV Playlists

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------
      # 1. Checkout repository
      # -------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # -------------------------------------
      # 2. Python
      # -------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # -------------------------------------
      # 3. Dependencies
      # -------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      # -------------------------------------
      # 4. Refresh configured stream URLs
      #
      # update_sources.py should modify
      # Master.m3u
      # -------------------------------------

      - name: Refresh eligible stream URLs
        run: |
          python update_sources.py

      # -------------------------------------
      # 5. Check every stream in Master.m3u
      # exactly once
      # -------------------------------------

      - name: Check master playlist
        run: |
          python check_playlist.py

      # -------------------------------------
      # 6. Build active Playlist.m3u and
      # Offline.m3u
      # -------------------------------------

      - name: Generate active and offline playlists
        run: |
          python reorganize_playlist.py

      # -------------------------------------
      # 7. Sort Playlist.m3u and Offline.m3u
      # group first, channel second
      # -------------------------------------

      - name: Sort generated playlists
        run: |
          python sort_playlist.py

      # -------------------------------------
      # 8. Build individual category files
      #
      # Malayalam.m3u
      # Hindi.m3u
      # English.m3u
      # Tamil.m3u
      # Sports.m3u
      # Kids.m3u
      # Food.m3u
      # -------------------------------------

      - name: Build category playlists
        run: |
          python build_category_playlists.py

      # -------------------------------------
      # 9. Upload reports
      # -------------------------------------

      - name: Upload playlist reports
        uses: actions/upload-artifact@v7
        with:
          name: playlist-report
          path: |
            playlist_report.txt
            source_update_report.txt
          if-no-files-found: warn

      # -------------------------------------
      # 10. Commit generated files
      # -------------------------------------

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Master.m3u
          git add Playlist.m3u
          git add Offline.m3u

          git add Malayalam.m3u
          git add Hindi.m3u
          git add English.m3u
          git add Tamil.m3u
          git add Sports.m3u
          git add Kids.m3u
          git add Food.m3u

          git add playlist_status.json
          git add playlist_report.txt

          if [ -f source_update_report.txt ]; then
            git add source_update_report.txt
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTV playlists"
            git pull --rebase
            git push
          fi
