name: Update and Check Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      # 1. Clean playlist
      - name: Clean playlist
        run: |
          python update_playlist.py

      # 2. Test every stream ONCE
      - name: Check playlist
        run: |
          python check_playlist.py

      # 3. Try configured URL refreshes
      - name: Refresh broken stream URLs
        run: |
          python update_sources.py

      # 4. Move broken channels to 99.Offline
      # and restore recovered channels.
      - name: Reorganize offline channels
        run: |
          python reorganize_playlist.py

      # 5. Sort group -> channel
      - name: Sort playlist
        run: |
          python sort_playlist.py

      # 6. Upload reports
      - name: Upload playlist reports
        uses: actions/upload-artifact@v4
        with:
          name: playlist-report
          path: |
            playlist_report.txt
            source_update_report.txt
          if-no-files-found: warn

      # 7. Commit everything
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Playlist.m3u
          git add playlist_status.json
          git add playlist_report.txt

          if [ -f source_update_report.txt ]; then
            git add source_update_report.txt
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update, organize and sort playlist"
            git pull --rebase
            git push
          fi
