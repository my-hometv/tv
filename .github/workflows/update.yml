name: Update IPTV Playlists

on:
  workflow_dispatch:

  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      # =====================================
      # 1. Duplicate cleanup
      # =====================================
      - name: Check and remove duplicate channels
        run: |
          python deduplicate_master.py

      # =====================================
      # 2. Refresh configured broken URLs
      # =====================================
      - name: Refresh eligible stream URLs
        run: |
          python update_sources.py

      # =====================================
      # 3. Deep IPTV/HLS check
      # =====================================
      - name: Check master playlist
        run: |
          python check_playlist.py

      # =====================================
      # 4. Generate active/offline playlists
      # =====================================
      - name: Generate active and offline playlists
        run: |
          python reorganize_playlist.py

      # =====================================
      # 5. Sort generated playlists
      # =====================================
      - name: Sort generated playlists
        run: |
          python sort_playlist.py

      # =====================================
      # 6. Build language/category playlists
      # =====================================
      - name: Build category playlists
        run: |
          python build_category_playlists.py

      # =====================================
      # 7. Scan BhoomTV Malayalam
      #
      # REPORT ONLY.
      # Does NOT modify Master.m3u.
      # =====================================
      - name: Scan BhoomTV Malayalam
        run: |
          python scan_bhoomtv.py

      # =====================================
      # 8. Upload reports
      # =====================================
      - name: Upload playlist reports
        uses: actions/upload-artifact@v7
        with:
          name: playlist-report
          path: |
            playlist_report.txt
            source_update_report.txt
            duplicate_report.txt
            bhoomtv_malayalam_report.txt
          if-no-files-found: warn

      # =====================================
      # 9. Commit generated files
      # =====================================
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f Master.m3u ]; then
            git add Master.m3u
          fi

          if [ -f Playlist.m3u ]; then
            git add Playlist.m3u
          fi

          if [ -f Offline.m3u ]; then
            git add Offline.m3u
          fi

          if [ -f Malayalam.m3u ]; then
            git add Malayalam.m3u
          fi

          if [ -f Hindi.m3u ]; then
            git add Hindi.m3u
          fi

          if [ -f English.m3u ]; then
            git add English.m3u
          fi

          if [ -f Tamil.m3u ]; then
            git add Tamil.m3u
          fi

          if [ -f Kids.m3u ]; then
            git add Kids.m3u
          fi

          if [ -f Food.m3u ]; then
            git add Food.m3u
          fi

          if [ -f Sports.m3u ]; then
            git add Sports.m3u
          fi

          if [ -f playlist_status.json ]; then
            git add playlist_status.json
          fi

          if [ -f playlist_report.txt ]; then
            git add playlist_report.txt
          fi

          if [ -f source_update_report.txt ]; then
            git add source_update_report.txt
          fi

          if [ -f duplicate_report.txt ]; then
            git add duplicate_report.txt
          fi

          if [ -f bhoomtv_malayalam_report.txt ]; then
            git add bhoomtv_malayalam_report.txt
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTV playlists and BhoomTV scan"
            git pull --rebase
            git push
          fi
